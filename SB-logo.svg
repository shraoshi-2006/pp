<svg viewBox="0 0 400 400" width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Circle Radial Gradient -->
    <radialGradient id="sphereGlow" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#cffafe" />
      <stop offset="70%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#22d3ee" />
    </radialGradient>
    
    <!-- Outer Cyber Ring Gradient -->
    <linearGradient id="cyberRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00f2fe" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Glowing Circular Orb -->
  <circle cx="200" cy="200" r="180" fill="url(#sphereGlow)" filter="url(#logoShadow)" />
  <circle cx="200" cy="200" r="180" fill="none" stroke="url(#cyberRing)" stroke-width="4" opacity="0.85" />

  <!-- Monogram Letters SB -->
  <g transform="translate(13,-15)">
    <!-- Letter S -->
    <g transform="translate(60,110) scale(2.1)">
      <path d="M 58,22
               C 58,9 46,0 29,0
               C 12,0 0,8 0,22
               C 0,38 15,44 29,50
               C 43,56 64,62 64,78
               C 64,92 52,100 29,100
               C 12,100 0,94 0,80"
            fill="none" stroke="#0f172a" stroke-width="9.5"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Letter B -->
    <g transform="translate(196,110) scale(2.1)">
      <path d="M 0,0 L 0,100
               M 0,4 C 30,4 52,12 52,26 C 52,40 32,46 4,48
               M 4,52 C 34,54 56,62 56,78 C 56,94 32,100 0,98"
            fill="none" stroke="#0f172a" stroke-width="9.5"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
